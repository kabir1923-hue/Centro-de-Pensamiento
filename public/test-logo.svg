<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Gold Color: #F0B823 or #EDB218 -->
  <defs>
    <style>
      .gold { fill: #ECAE1D; }
      .gold-stroke { stroke: #ECAE1D; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .bg-cut { stroke: #242424; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Little butterfly 1 (Top Left) -->
  <g transform="translate(34, 10)" fill="#ECAE1D">
    <!-- Left upper wing -->
    <path d="M0,6 C-3,2 -6,0 -8,1 C-10,3 -8,7 -4,9 Z" />
    <!-- Right upper wing -->
    <path d="M0,6 C3,2 6,0 8,1 C10,3 8,7 4,9 Z" />
    <!-- Left lower wing -->
    <path d="M-1,8 C-4,8 -6,11 -5,13 C-3,14 -1,11 0,9 Z" />
    <!-- Right lower wing -->
    <path d="M1,8 C4,8 6,11 5,13 C3,14 1,11 0,9 Z" />
  </g>

  <!-- Little butterfly 2 (Top Right) -->
  <g transform="translate(70, 14) scale(0.75)" fill="#ECAE1D">
    <path d="M0,6 C-3,2 -6,0 -8,1 C-10,3 -8,7 -4,9 Z" />
    <path d="M0,6 C3,2 6,0 8,1 C10,3 8,7 4,9 Z" />
    <path d="M-1,8 C-4,8 -6,11 -5,13 C-3,14 -1,11 0,9 Z" />
    <path d="M1,8 C4,8 6,11 5,13 C3,14 1,11 0,9 Z" />
  </g>

  <!-- Little butterfly 3 (Center between wings) -->
  <g transform="translate(48, 27) scale(0.65)" fill="#ECAE1D">
    <path d="M0,6 C-3,2 -6,0 -8,1 C-10,3 -8,7 -4,9 Z" />
    <path d="M0,6 C3,2 6,0 8,1 C10,3 8,7 4,9 Z" />
    <path d="M-1,8 C-4,8 -6,11 -5,13 C-3,14 -1,11 0,9 Z" />
    <path d="M1,8 C4,8 6,11 5,13 C3,14 1,11 0,9 Z" />
  </g>

  <!-- Main Butterfly: 4 Wings -->

  <!-- 1. Upper Left Wing (Rhombus with Spiral cut) -->
  <path d="M41,56 L10,32 L34,24 L43,47 Z" fill="#ECAE1D" />
  <!-- Spiral cut inside Upper Left wing -->
  <path d="M17,35 L31,29 L38,47 L23,53 L20,41 L30,37 L33,44" stroke="#242424" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 2. Upper Right Wing (Solid polygon) -->
  <path d="M48,56 L58,35 L93,36 L75,66 Z" fill="#ECAE1D" />

  <!-- 3. Lower Left Wing (Solid elongated rhombus) -->
  <path d="M41,63 L8,67 L26,97 L41,83 Z" fill="#ECAE1D" />

  <!-- 4. Lower Right Wing (Rhombus with spiral curl) -->
  <path d="M48,64 L72,99 L48,82 L47,67 Z" fill="none" />
  <path d="M48,63 L74,70 L65,99 L44,80 Z" fill="#ECAE1D" />
  <!-- Spiral curl cut inside Lower Right wing -->
  <path d="M51,75 C56,71 63,73 64,79 C65,85 58,89 54,85 C51,82 54,77 58,78" stroke="#242424" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>